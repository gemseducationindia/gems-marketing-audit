name: Kochi spend check (temporary)
on: {push: {branches: [claude/project-thread-ix47m2]}}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install openpyxl==3.1.5 cryptography==43.0.3
      - run: python kochi_check.py
        env: {MARKETING_SHEETS: "${{ secrets.MARKETING_SHEETS }}", META_TOKEN: "${{ secrets.META_TOKEN }}"}
