# One-off test of the Meta Marketing API token (META_TOKEN): runs on pushes to the test branch only. Output is encrypted.
name: Meta API test
on:
  push: {branches: [claude/project-thread-dyg0xt]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install cryptography==43.0.3
      - run: python meta_test.py
        env:
          META_TOKEN: "${{ secrets.META_TOKEN }}"
